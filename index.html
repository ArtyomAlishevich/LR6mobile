<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TaskFlow — Вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/normalize.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-page">
  <header class="brand-panel">
    <div class="wordmark">TaskFlow</div>
    <p class="tagline">Учёба и личные дела — в одной ленте задач, без переключения между приложениями.</p>
    <svg class="brand-illustration" viewBox="0 0 220 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="18" y="14" width="150" height="130" rx="2" transform="rotate(-4 18 14)" fill="#35503f" stroke="#d7e2d8" stroke-width="1.5"/>
      <rect x="30" y="24" width="150" height="130" rx="2" fill="#4a6b53" stroke="#d7e2d8" stroke-width="1.5"/>
      <line x1="30" y1="24" x2="30" y2="154" stroke="#d7e2d8" stroke-width="1.5"/>
      <circle cx="52" cy="48" r="6" stroke="#d7e2d8" stroke-width="1.6" fill="none"/>
      <path d="M49 48l2 2 4-5" stroke="#e8b33d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="66" y="45" width="90" height="6" rx="3" fill="#d7e2d8" opacity="0.85"/>
      <circle cx="52" cy="76" r="6" stroke="#d7e2d8" stroke-width="1.6" fill="none"/>
      <rect x="66" y="73" width="70" height="6" rx="3" fill="#d7e2d8" opacity="0.55"/>
      <circle cx="52" cy="104" r="6" stroke="#d7e2d8" stroke-width="1.6" fill="none"/>
      <path d="M49 104l2 2 4-5" stroke="#e8b33d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="66" y="101" width="95" height="6" rx="3" fill="#d7e2d8" opacity="0.85"/>
    </svg>
  </header>
  <div class="form-panel">
    <main class="inner">
      <h1 class="form-title">С возвращением</h1>
      <p class="form-sub">Войдите, чтобы вернуться к своим задачам.</p>
      <form onsubmit="return false;">
        <div class="field">
          <label for="email">Электронная почта</label>
          <input id="email" type="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" type="password" placeholder="••••••••" required>
        </div>
        <div class="row-between">
          <span class="checkbox-line"><input type="checkbox" id="remember"><label for="remember" style="margin:0;font-weight:400;">Запомнить меня</label></span>
          <a href="#">Забыли пароль?</a>
        </div>
        <button class="btn-primary" type="submit">Войти</button>
      </form>
      <div class="divider">или</div>
      <footer class="switch-line">Впервые в TaskFlow? <a href="#">Создать аккаунт</a></footer>
    </main>
  </div>
</div>
<script src="js/main.js"></script>
</body>
</html>
